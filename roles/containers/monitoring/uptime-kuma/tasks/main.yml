---
- name: Ensure Uptime Kuma data dir exists
  file:
    path: "{{ docker_dir }}/{{ container_name }}"
    state: directory
    owner: "{{ username }}"
    group: users
    mode: '0775'

- name: Make sure the Uptime Kuma container is running
  docker_container:
    name: "{{ container_name }}"
    image: "louislam/uptime-kuma:1"
    pull: yes
    state: started
    published_ports:
      - "{{ uptime_kuma_bind }}:{{ uptime_kuma_port }}:3001"
    env:
      TZ: "{{ timezone }}"
    volumes:
      - "{{ docker_dir }}/{{ container_name }}:/app/data"
    # Point at Pi-hole on the host. Otherwise Docker hands the container
    # 8.8.8.8 and internal-only subdomains (grafana, home, ollama, chat,
    # *arr stack) NXDOMAIN — Kuma reports them down even when SWAG is fine.
    dns_servers:
      - "{{ uptime_kuma_dns | default('192.168.50.10') }}"
    restart_policy: unless-stopped
