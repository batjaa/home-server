---
- name: Ensure Grafana directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: '472'
    group: '472'
    mode: '0755'
  loop:
    - "{{ docker_dir }}/{{ container_name }}"
    - "{{ docker_dir }}/{{ container_name }}/data"

- name: Provision dashboards and datasources
  copy:
    src: provisioning
    dest: "{{ docker_dir }}/{{ container_name }}/"
    owner: '472'
    group: '472'
    mode: '0644'
    directory_mode: '0755'


- name: Make sure the Grafana container is running
  docker_container:
    name: "{{ container_name }}"
    image: "grafana/grafana:latest"
    pull: yes
    state: started
    networks:
      - name: "{{ grafana_network }}"
    networks_cli_compatible: yes
    published_ports:
      - "127.0.0.1:{{ grafana_port }}:3000"
    user: "472"
    env:
      TZ: "{{ timezone }}"
      GF_SERVER_ROOT_URL: "{{ grafana_root_url }}"
      GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user | default('admin') }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - "{{ docker_dir }}/{{ container_name }}/data:/var/lib/grafana"
      - "{{ docker_dir }}/{{ container_name }}/provisioning:/etc/grafana/provisioning"
    restart_policy: unless-stopped

- name: Wait for Grafana API to be ready
  uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/health"
    status_code: 200
  register: gf_health
  retries: 30
  delay: 2
  until: gf_health.status == 200

- name: Wait for provisioned home dashboard to exist in DB
  uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/dashboards/uid/home"
    status_code: 200
    user: "{{ grafana_admin_user | default('admin') }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: yes
  register: gf_home_dash
  retries: 15
  delay: 2
  until: gf_home_dash.status == 200

- name: Set Home dashboard as the org default
  uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/org/preferences"
    method: PUT
    user: "{{ grafana_admin_user | default('admin') }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: yes
    body_format: json
    body:
      homeDashboardUID: home
      theme: ""
      timezone: ""
    status_code: 200
  changed_when: true
