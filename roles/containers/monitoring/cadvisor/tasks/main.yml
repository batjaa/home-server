---
- name: Ensure monitoring Docker network exists
  docker_network:
    name: "{{ cadvisor_network }}"
    state: present

- name: Make sure the cAdvisor container is running
  docker_container:
    name: "{{ container_name }}"
    image: "gcr.io/cadvisor/cadvisor:latest"
    pull: yes
    state: started
    networks:
      - name: "{{ cadvisor_network }}"
    networks_cli_compatible: yes
    published_ports:
      - "127.0.0.1:{{ cadvisor_port }}:8080"
    privileged: true
    devices:
      - "/dev/kmsg:/dev/kmsg"
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/dev/disk/:/dev/disk:ro"
    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
    restart_policy: unless-stopped
