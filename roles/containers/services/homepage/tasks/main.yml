---
- name: Ensure Homepage config dir exists
  file:
    path: "{{ docker_dir }}/{{ container_name }}"
    state: directory
    owner: "{{ username }}"
    group: users
    mode: '0775'

- name: Render Homepage config files
  template:
    src: "{{ item }}.j2"
    dest: "{{ docker_dir }}/{{ container_name }}/{{ item }}"
    mode: '0644'
  loop:
    - settings.yaml
    - services.yaml
    - widgets.yaml
    - bookmarks.yaml
    - docker.yaml
  notify: restart homepage

- name: Make sure the Homepage container is running
  docker_container:
    name: "{{ container_name }}"
    image: "ghcr.io/gethomepage/homepage:latest"
    pull: yes
    state: started
    network_mode: host
    env:
      PUID: "{{ guid }}"
      PGID: "{{ guid }}"
      TZ: "{{ timezone }}"
      HOMEPAGE_ALLOWED_HOSTS: "home.{{ host }},home.home.local,127.0.0.1:{{ homepage_port }}"
      PORT: "{{ homepage_port | string }}"
    volumes:
      - "{{ docker_dir }}/{{ container_name }}:/app/config"
      # Bind the underlying filesystems (not the mergerfs fuse unions —
      # fuse mounts don't propagate through Docker bind mounts).
      # The widget reads statvfs(); these are the source-of-truth backing FS.
      - "/mnt/sda1:/mnt/sda1:ro"
      - "/mnt/backup1:/mnt/backup1:ro"
    restart_policy: unless-stopped
