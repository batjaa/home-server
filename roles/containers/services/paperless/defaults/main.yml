---
container_name: paperless
paperless_db_container: paperless-db
paperless_redis_container: paperless-redis
paperless_network: paperless-net

paperless_port: 8083
paperless_image: "ghcr.io/paperless-ngx/paperless-ngx:3.1.3"
# Preserve the audited database engines during application-only upgrades.
paperless_db_image: "docker.io/library/postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b"
paperless_redis_image: "docker.io/library/redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2"
paperless_redis_data_dir: "{{ docker_dir }}/{{ paperless_redis_container }}"

# Documents live on mergerfs (large, backed up); config + DB on plain ext4
paperless_media_dir: "{{ mergerfs_root }}/Paperless/media"
paperless_consume_dir: "{{ mergerfs_root }}/Paperless/consume"
paperless_export_dir: "{{ mergerfs_root }}/Paperless/export"

paperless_db_name: paperless
paperless_db_user: paperless
paperless_admin_user: batjaa
paperless_default_language: eng
paperless_ocr_languages: eng
