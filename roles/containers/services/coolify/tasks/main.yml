---
- name: Ensure Coolify host packages are installed
  package:
    name:
      - curl
      - openssh-server
      - openssl
    state: present

- name: Enable memory overcommit for Coolify Redis
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-coolify.conf
    reload: yes

- name: Check whether Coolify is already installed
  stat:
    path: "{{ coolify_env_file }}"
  register: coolify_install_state

# Bootstrap only: once installed, Coolify's install/upgrade script owns this
# tree as the in-container www-data uid (coolify_container_uid) and re-running
# this with root:root would break the control plane's writes.
- name: Ensure Coolify host directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ coolify_root_dir }}"
    - "{{ coolify_source_dir }}"
    - "{{ coolify_root_dir }}/ssh"
    - "{{ coolify_root_dir }}/applications"
    - "{{ coolify_root_dir }}/databases"
    - "{{ coolify_root_dir }}/services"
    - "{{ coolify_root_dir }}/backups"
  when: not coolify_install_state.stat.exists

- name: Download Coolify installer
  get_url:
    url: "{{ coolify_install_script_url }}"
    dest: /usr/local/sbin/coolify-install.sh
    mode: "0755"

- name: Install Coolify
  command: /usr/local/sbin/coolify-install.sh
  environment:
    USER: "{{ username }}"
    HOME: "/home/{{ username }}"
    AUTOUPDATE: "{{ 'true' if coolify_auto_update else 'false' }}"
    ROOT_USERNAME: "{{ coolify_root_username }}"
    ROOT_USER_EMAIL: "{{ coolify_root_user_email }}"
    ROOT_USER_PASSWORD: "{{ coolify_root_user_password }}"
  when: not coolify_install_state.stat.exists
  register: coolify_install
  changed_when: true

# Coolify's install/upgrade script chmods /data/coolify to 700 for its
# container uid, but scheduled DB backups run over SSH as the deploy user
# and need to traverse into backups/ to write the dump — without o+x every
# backup fails with "Permission denied" until re-converged. Re-run this
# role after any Coolify upgrade.
- name: Ensure backup dirs are traversable by the SSH deploy user
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ coolify_container_uid }}"
    group: root
    mode: "0711"
  loop:
    - "{{ coolify_root_dir }}"
    - "{{ coolify_root_dir }}/backups"
    - "{{ coolify_root_dir }}/backups/coolify"

- name: Set Coolify app port
  lineinfile:
    path: "{{ coolify_env_file }}"
    regexp: "^APP_PORT="
    line: "APP_PORT={{ coolify_app_port }}"
  register: coolify_app_port_config

- name: Set Coolify realtime port
  lineinfile:
    path: "{{ coolify_env_file }}"
    regexp: "^SOKETI_PORT="
    line: "SOKETI_PORT={{ coolify_soketi_port }}"
    insertafter: EOF
  register: coolify_soketi_port_config

- name: Restart Coolify after configuration changes
  command:
    argv:
      - docker
      - compose
      - -f
      - docker-compose.yml
      - -f
      - docker-compose.prod.yml
      - up
      - -d
  args:
    chdir: "{{ coolify_source_dir }}"
  when: coolify_app_port_config.changed or coolify_soketi_port_config.changed
  changed_when: true

- name: Wait for Coolify API health endpoint
  uri:
    url: "http://127.0.0.1:{{ coolify_app_port }}/api/health"
    method: GET
    status_code: 200
  register: coolify_health
  retries: 30
  delay: 10
  until: coolify_health.status == 200
