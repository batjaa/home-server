---
container_name: nextcloud
nextcloud_db_container: nextcloud-db
nextcloud_network: nextcloud-net

# Host port that SWAG proxies to
nextcloud_port: 8081

# Pin reviewed releases; Nextcloud only supports one major upgrade at a time.
nextcloud_image: "nextcloud:34.0.4-apache"
nextcloud_db_image: "mariadb:11@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf"

# User data lives on plain ext4 (NVMe). mergerfs uid handling makes
# permissions painful for non-1000 containers; revisit later if data grows.
nextcloud_data_dir: "{{ docker_dir }}/{{ container_name }}-data"

# Nextcloud DB defaults (override secret values in host_vars/secret.yml)
nextcloud_db_name: nextcloud
nextcloud_db_user: nextcloud
