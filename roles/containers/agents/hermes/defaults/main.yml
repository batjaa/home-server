---
container_name: hermes
hermes_image: "nousresearch/hermes-agent:latest"
hermes_data_dir: "/opt/docker/data/hermes"

# Published loopback ports (SWAG proxies the dashboard; the gateway API stays
# loopback-only for other OpenAI-wire clients on the host).
hermes_dashboard_port: 9119   # web dashboard  -> agent.{{ host }}
hermes_api_port: 8642         # OpenAI-compatible gateway API (loopback only)

# Model backend — greymon's Ollama over its OpenAI-compatible API.
# config.yaml is the source of truth for provider/model; secrets come via env.
hermes_model_provider: "openai"
# Primary backend: OpenAI GPT-5.5 — a frontier model handles the full agent loop
# (including opening its own PRs) reliably. The local greymon qwen3-coder remains a
# documented fallback (set base_url to http://192.168.50.30:11434/v1, model
# qwen3-coder-64k, ollama_num_ctx 65536) but the local 30B couldn't finish
# autonomous tasks — it stops after pushing and fumbles the PR API. See
# docs/hermes-agent.md.
hermes_model_default: "gpt-5.5"
hermes_model_context_length: 200000
hermes_model_ollama_num_ctx: 0          # >0 only for a local Ollama backend
hermes_openai_base_url: "https://api.openai.com/v1"
# hermes_openai_api_key: real OpenAI key, set in host_vars/andromon/secret.yml (vault)
hermes_openai_api_key: ""

# Dashboard basic auth (password is a vault secret, see below)
hermes_dashboard_username: "batjaa"

# Telegram task-intake allowlist. SECURITY-CRITICAL: the bot can run code and push
# to GitHub, so Telegram is only enabled when this is set to your numeric chat id
# (comma-separated for multiple). Not a secret — your own Telegram user id.
hermes_telegram_allowed_chats: ""

# Run as batjaa's uid/gid so /opt/docker/data/hermes ownership stays consistent
# with the rest of the stack and the nightly backup. The image is UID 10000 by
# default; HERMES_UID/HERMES_GID remap it.
hermes_uid: "{{ guid }}"
hermes_gid: "{{ guid }}"

# Secrets — define in host_vars/andromon/secret.yml (vault):
#   hermes_github_token         fine-grained PAT for the bot account (contents:write
#                               on feature branches + PR read/write; main protected)
#   hermes_telegram_bot_token   from @BotFather
#   hermes_dashboard_password   basic-auth password for agent.{{ host }}
#   hermes_api_server_key       openssl rand -hex 32
