---
- name: Ensure Jellyfin config dir exists
  file:
    path: "{{ docker_dir }}/{{ container_name }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ guid }}"
    mode: '0775'

- name: Inspect the existing Jellyfin container
  community.docker.docker_container_info:
    name: "{{ container_name }}"
  register: jellyfin_before
  no_log: true

- name: Prepare a backed-up Jellyfin upgrade
  ansible.builtin.include_tasks: upgrade.yml
  when:
    - jellyfin_before.exists
    - jellyfin_before.container.Config.Image != jellyfin_image

- name: Make sure the Jellyfin container is running
  docker_container:
    name: "{{ container_name }}"
    image: "{{ jellyfin_image }}"
    pull: missing
    state: started
    network_mode: host
    devices:
      - "/dev/dri:/dev/dri"
    groups:
      - "{{ gpu_render_gid }}"
      - "{{ gpu_video_gid }}"
    env:
      PUID: "{{ guid }}"
      PGID: "{{ guid }}"
      TZ: "{{ timezone }}"
      JELLYFIN_PublishedServerUrl: "https://jellyfin.{{ host }}"
    volumes:
      - "{{ docker_dir }}/{{ container_name }}:/config"
      - "{{ mergerfs_root }}/Media:/media:ro"
    restart_policy: unless-stopped

- name: Wait for Jellyfin API to be ready
  uri:
    url: "http://127.0.0.1:8096/health"
    status_code: 200
    return_content: true
  register: jf_health
  retries: 360
  delay: 5
  until: jf_health.status == 200 and jf_health.content == "Healthy"

# Preserve the complete encoding configuration: the API replaces this object.
- name: Read the existing Jellyfin encoding configuration
  ansible.builtin.uri:
    url: http://127.0.0.1:8096/System/Configuration/encoding
    headers:
      Authorization: 'MediaBrowser Token="{{ jellyfin_api_key }}"'
    return_content: true
  register: jellyfin_encoding
  retries: 360
  delay: 5
  until: jellyfin_encoding.status == 200
  when: jellyfin_api_key is defined
  no_log: true

- name: Configure QSV hardware transcoding
  ansible.builtin.uri:
    url: http://127.0.0.1:8096/System/Configuration/encoding
    method: POST
    headers:
      Authorization: 'MediaBrowser Token="{{ jellyfin_api_key }}"'
    body_format: json
    body: "{{ jellyfin_encoding.json | combine(jellyfin_qsv_settings) }}"
    status_code: 204
  when:
    - jellyfin_api_key is defined
    - jellyfin_encoding.json | combine(jellyfin_qsv_settings) != jellyfin_encoding.json
  changed_when: true
  no_log: true

- name: Check whether the v12 migration needs its full library scan
  ansible.builtin.stat:
    path: "{{ docker_dir }}/{{ container_name }}/.ansible-v12-scan-pending"
  register: jellyfin_scan_pending

- name: Start the required post-migration full library scan
  ansible.builtin.uri:
    url: http://127.0.0.1:8096/Library/Refresh
    method: POST
    headers:
      Authorization: 'MediaBrowser Token="{{ jellyfin_api_key }}"'
    status_code: 204
  when: jellyfin_scan_pending.stat.exists
  changed_when: true
  no_log: true

- name: Record that the post-migration scan was requested
  ansible.builtin.file:
    path: "{{ docker_dir }}/{{ container_name }}/.ansible-v12-scan-pending"
    state: absent
