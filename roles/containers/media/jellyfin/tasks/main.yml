---
- name: Ensure Jellyfin config dir exists
  file:
    path: "{{ docker_dir }}/{{ container_name }}"
    state: directory
    owner: "{{ username }}"
    group: users
    mode: '0775'

- name: Make sure the Jellyfin container is running
  docker_container:
    name: "{{ container_name }}"
    image: "lscr.io/linuxserver/jellyfin:latest"
    pull: yes
    state: started
    network_mode: host
    devices:
      - "/dev/dri:/dev/dri"
    groups:
      - "{{ gpu_render_gid }}"
      - "{{ gpu_video_gid }}"
    env:
      PUID: "{{ guid }}"
      PGID: "{{ guid }}"
      TZ: "{{ timezone }}"
      JELLYFIN_PublishedServerUrl: "https://jellyfin.{{ host }}"
    volumes:
      - "{{ docker_dir }}/{{ container_name }}:/config"
      - "{{ mergerfs_root }}/Media:/media:ro"
    restart_policy: unless-stopped

# After deploy: enable QSV in Jellyfin via API so the dashboard toggle
# isn't needed. Idempotent — re-applies on every run.
- name: Wait for Jellyfin API to be ready
  uri:
    url: "http://127.0.0.1:8096/health"
    status_code: [200, 401]
  register: jf_health
  retries: 30
  delay: 2
  until: jf_health.status in [200, 401]

- name: Configure QSV hardware transcoding via /System/Configuration/encoding
  # Requires `jellyfin_api_key` in host_vars/<host>/secret.yml. Generate one at
  #   Dashboard → Administration → API Keys → "+ New API Key"
  # Without it this task skips and you can flip the dashboard toggles by hand.
  uri:
    url: "http://127.0.0.1:8096/System/Configuration/encoding"
    method: POST
    headers:
      X-Emby-Token: "{{ jellyfin_api_key | default('') }}"
    body_format: json
    body:
      HardwareAccelerationType: "qsv"
      EnableHardwareEncoding: true
      AllowHevcEncoding: true
      # UHD 750 (Gen 12) does NOT support AV1 *encode* — only decode. Leaving
      # this true makes Jellyfin silently fall back to (slow) software AV1.
      AllowAv1Encoding: false
      EnableTonemapping: true
      EnableVppTonemapping: true
      VaapiDevice: "/dev/dri/renderD128"
      QsvDevice: ""
      EnableIntelLowPowerH264HwEncoder: true
      EnableIntelLowPowerHevcHwEncoder: true
      # Decode is broader than encode on Intel iGPU — VP9 + AV1 are decode-only
      HardwareDecodingCodecs:
        - h264
        - hevc
        - mpeg2video
        - vc1
        - vp9
        - av1
      EnableDecodingColorDepth10Hevc: true
      EnableDecodingColorDepth10Vp9: true
    status_code: [204]
  when: jellyfin_api_key is defined
  changed_when: false
