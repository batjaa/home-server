---
container_name: photoprism
photoprism_db_container: photoprism-mariadb
photoprism_network: photoprism-net

# Host port that SWAG proxies to (bound to localhost only)
photoprism_port: 2342

# Where the originals live. PhotoPrism scans this path for photos.
photoprism_originals: "{{ mergerfs_root }}/Photos"

# DB defaults (override secrets in host_vars/secret.yml)
photoprism_db_name: photoprism
photoprism_db_user: photoprism

# Optional: hardware acceleration — set to true if Intel iGPU available
photoprism_intel_gpu: false
