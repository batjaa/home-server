---
- name: Ensure PhotoPrism directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ username }}"
    group: users
    mode: '0775'
  loop:
    - "{{ docker_dir }}/{{ container_name }}"
    - "{{ docker_dir }}/{{ container_name }}/storage"
    - "{{ docker_dir }}/{{ photoprism_db_container }}"
    - "{{ photoprism_originals }}"

- name: Create PhotoPrism Docker network
  docker_network:
    name: "{{ photoprism_network }}"
    state: present

- name: Make sure the PhotoPrism MariaDB container is running
  docker_container:
    name: "{{ photoprism_db_container }}"
    image: "mariadb:11"
    pull: yes
    state: started
    networks:
      - name: "{{ photoprism_network }}"
    networks_cli_compatible: yes
    command: >-
      --transaction-isolation=READ-COMMITTED
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=512
      --innodb-rollback-on-timeout=OFF
      --innodb-lock-wait-timeout=120
    env:
      MARIADB_ROOT_PASSWORD: "{{ photoprism_db_root_password }}"
      MARIADB_DATABASE: "{{ photoprism_db_name }}"
      MARIADB_USER: "{{ photoprism_db_user }}"
      MARIADB_PASSWORD: "{{ photoprism_db_password }}"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ docker_dir }}/{{ photoprism_db_container }}:/var/lib/mysql"
    restart_policy: unless-stopped

- name: Make sure the PhotoPrism container is running
  docker_container:
    name: "{{ container_name }}"
    image: "photoprism/photoprism:latest"
    pull: yes
    state: started
    networks:
      - name: "{{ photoprism_network }}"
    networks_cli_compatible: yes
    published_ports:
      - "127.0.0.1:{{ photoprism_port }}:2342"
    security_opts:
      - seccomp:unconfined
      - apparmor:unconfined
    shm_size: "2g"
    devices: "{{ ['/dev/dri/renderD128:/dev/dri/renderD128'] if photoprism_intel_gpu else [] }}"
    working_dir: "/photoprism"
    env:
      PHOTOPRISM_UID: "{{ guid }}"
      PHOTOPRISM_GID: "{{ guid }}"
      PHOTOPRISM_ADMIN_USER: "{{ photoprism_admin_user | default('admin') }}"
      PHOTOPRISM_ADMIN_PASSWORD: "{{ photoprism_admin_password }}"
      PHOTOPRISM_SITE_URL: "https://photos.{{ host }}/"
      PHOTOPRISM_HTTP_HOST: "0.0.0.0"
      PHOTOPRISM_HTTP_PORT: "2342"
      PHOTOPRISM_HTTP_COMPRESSION: "gzip"
      PHOTOPRISM_TRUSTED_PROXY: "127.0.0.1/32"
      PHOTOPRISM_DATABASE_DRIVER: "mysql"
      PHOTOPRISM_DATABASE_SERVER: "{{ photoprism_db_container }}:3306"
      PHOTOPRISM_DATABASE_NAME: "{{ photoprism_db_name }}"
      PHOTOPRISM_DATABASE_USER: "{{ photoprism_db_user }}"
      PHOTOPRISM_DATABASE_PASSWORD: "{{ photoprism_db_password }}"
      PHOTOPRISM_DISABLE_CHOWN: "false"
      PHOTOPRISM_DISABLE_BACKUPS: "true"
      PHOTOPRISM_DETECT_NSFW: "true"
      PHOTOPRISM_UPLOAD_NSFW: "false"
      PHOTOPRISM_FFMPEG_ENCODER: "{{ 'h264_qsv' if photoprism_intel_gpu else 'software' }}"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ photoprism_originals }}:/photoprism/originals"
      - "{{ docker_dir }}/{{ container_name }}/storage:/photoprism/storage"
    restart_policy: unless-stopped

- name: Schedule a daily index scan at 01:30
  cron:
    name: photoprism index
    hour: "1"
    minute: "30"
    job: "/usr/bin/docker exec {{ container_name }} photoprism index --cleanup"
