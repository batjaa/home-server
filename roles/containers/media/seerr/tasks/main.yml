---
- name: Ensure Seerr config dir exists, owned by node (uid 1000)
  # Seerr's image runs as the `node` user (uid 1000) and won't honour
  # PUID/PGID — we explicitly chown the bind-mounted config dir.
  file:
    path: "{{ docker_dir }}/{{ container_name }}"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0775'
    recurse: yes

- name: Ensure Seerr logs dir exists, owned by node (uid 1000)
  file:
    path: "{{ docker_dir }}/{{ container_name }}/logs"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0775'

- name: Ensure arr Docker network
  docker_network:
    name: "{{ arr_network }}"
    state: present

- name: Make sure the Seerr container is running
  docker_container:
    name: "{{ container_name }}"
    image: "ghcr.io/seerr-team/seerr:latest"
    pull: yes
    state: started
    init: yes
    networks:
      - name: "{{ arr_network }}"
    networks_cli_compatible: yes
    published_ports:
      - "127.0.0.1:{{ seerr_port }}:5055"
    env:
      LOG_LEVEL: "info"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ docker_dir }}/{{ container_name }}:/app/config"
    restart_policy: unless-stopped

- name: Wait for Seerr status endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ seerr_port }}/api/v1/status"
    status_code: 200
  register: seerr_status
  until: seerr_status.status == 200
  retries: 30
  delay: 2
