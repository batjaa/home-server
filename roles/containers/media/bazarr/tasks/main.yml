---
- name: Ensure Bazarr config dir exists
  file:
    path: "{{ docker_dir }}/{{ container_name }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ guid }}"
    mode: '0775'

- name: Ensure arr Docker network
  docker_network:
    name: "{{ arr_network }}"
    state: present

- name: Make sure the Bazarr container is running
  docker_container:
    name: "{{ container_name }}"
    image: "{{ bazarr_image }}"
    pull: yes
    state: started
    networks:
      - name: "{{ arr_network }}"
    networks_cli_compatible: yes
    published_ports:
      - "127.0.0.1:{{ bazarr_port }}:6767"
    env:
      PUID: "{{ guid }}"
      PGID: "{{ guid }}"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ docker_dir }}/{{ container_name }}:/config"
      - "{{ mergerfs_root }}:/storage"
    restart_policy: unless-stopped

- name: Read Bazarr integration settings
  uri:
    url: "http://127.0.0.1:{{ bazarr_port }}/api/system/settings"
    headers:
      X-API-KEY: "{{ bazarr_api_key }}"
    status_code: 200
  register: bazarr_settings
  until: bazarr_settings.status == 200
  retries: 30
  delay: 2
  no_log: true

- name: Keep enabled Bazarr integrations authenticated with vaulted API keys
  uri:
    url: "http://127.0.0.1:{{ bazarr_port }}/api/system/settings"
    method: POST
    headers:
      X-API-KEY: "{{ bazarr_api_key }}"
    body_format: form-urlencoded
    body: "{{ {'settings-' + item.name + '-apikey': item.key} }}"
    status_code: 204
  loop:
    - { name: sonarr, key: "{{ sonarr_api_key }}" }
    - { name: radarr, key: "{{ radarr_api_key }}" }
  when:
    - bazarr_settings.json.general['use_' + item.name] | default(false) | bool
    - bazarr_settings.json[item.name].apikey | default('') != item.key
  changed_when: true
  no_log: true
