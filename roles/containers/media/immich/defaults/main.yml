---
container_name: immich-server
immich_db_container: immich-db
immich_redis_container: immich-redis
immich_ml_container: immich-machine-learning
immich_network: immich-net

# Host port that SWAG proxies to (bound to 127.0.0.1)
immich_port: 2283

# Where Immich stores all photos (its own DB-managed structure on mergerfs).
# After bulk-import, this is the single source of truth — no external library.
immich_upload_dir: "{{ mergerfs_root }}/Immich"

# Image pins (track release on the immich server, sync ML to match)
immich_server_image: "ghcr.io/immich-app/immich-server:release"
immich_ml_image: "ghcr.io/immich-app/immich-machine-learning:release"
immich_db_image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0"
immich_redis_image: "docker.io/redis:6.2-alpine"

# DB defaults (override secrets in host_vars/secret.yml)
immich_db_name: immich
immich_db_user: postgres

# Postgres tuning (data dir lives on NVMe). Sized for a 16 GiB host
# that shares RAM with many other containers — kept deliberately modest
# so Postgres doesn't starve Plex/Jellyfin/Immich-server of page cache.
# Vector index reindexing benefits most from maintenance_work_mem.
immich_db_shared_buffers: 1GB
immich_db_effective_cache_size: 4GB
immich_db_work_mem: 16MB
immich_db_maintenance_work_mem: 512MB
immich_db_wal_buffers: 16MB
immich_db_random_page_cost: '1.1'
immich_db_effective_io_concurrency: '200'
immich_db_shm_size: 1GB
