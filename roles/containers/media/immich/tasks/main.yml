---
- name: Ensure Immich directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ username }}"
    group: users
    mode: '0775'
  loop:
    - "{{ immich_upload_dir }}"
    - "{{ docker_dir }}/{{ immich_db_container }}"
    - "{{ docker_dir }}/{{ immich_ml_container }}"

- name: Create Immich Docker network
  docker_network:
    name: "{{ immich_network }}"
    state: present

# ── Postgres (with pgvector / vectorchord extension) ──────────────────────
- name: Make sure the Immich Postgres container is running
  docker_container:
    name: "{{ immich_db_container }}"
    image: "{{ immich_db_image }}"
    pull: yes
    state: started
    networks:
      - name: "{{ immich_network }}"
    networks_cli_compatible: yes
    env:
      POSTGRES_USER: "{{ immich_db_user }}"
      POSTGRES_PASSWORD: "{{ immich_db_password }}"
      POSTGRES_DB: "{{ immich_db_name }}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
      DB_STORAGE_TYPE: "SSD"
    volumes:
      - "{{ docker_dir }}/{{ immich_db_container }}:/var/lib/postgresql/data"
    shm_size: "{{ immich_db_shm_size }}"
    # NOTE: vchord (vectorchord) MUST be in shared_preload_libraries — the
    # extension refuses to load otherwise and immich-server crash-loops on
    # any vector query. This line is non-negotiable; do not remove it.
    command:
      - postgres
      - -c
      - "shared_preload_libraries=vchord.so"
      - -c
      - "shared_buffers={{ immich_db_shared_buffers }}"
      - -c
      - "effective_cache_size={{ immich_db_effective_cache_size }}"
      - -c
      - "work_mem={{ immich_db_work_mem }}"
      - -c
      - "maintenance_work_mem={{ immich_db_maintenance_work_mem }}"
      - -c
      - "wal_buffers={{ immich_db_wal_buffers }}"
      - -c
      - "random_page_cost={{ immich_db_random_page_cost }}"
      - -c
      - "effective_io_concurrency={{ immich_db_effective_io_concurrency }}"
    restart_policy: unless-stopped

# Guard: if the Postgres command ever drops shared_preload_libraries again,
# fail loudly here rather than letting immich-server crash-loop in production.
- name: Verify vchord is in Postgres shared_preload_libraries
  command: >-
    docker exec {{ immich_db_container }}
    psql -U {{ immich_db_user }} -d {{ immich_db_name }} -tAc
    "SHOW shared_preload_libraries"
  register: immich_db_preload
  changed_when: false
  retries: 10
  delay: 3
  until: immich_db_preload.rc == 0
  failed_when: >
    immich_db_preload.rc != 0 or
    'vchord' not in (immich_db_preload.stdout | default(''))

# ── Redis ──────────────────────────────────────────────────────────────────
- name: Make sure the Immich Redis container is running
  docker_container:
    name: "{{ immich_redis_container }}"
    image: "{{ immich_redis_image }}"
    pull: yes
    state: started
    networks:
      - name: "{{ immich_network }}"
    networks_cli_compatible: yes
    restart_policy: unless-stopped

# ── Machine Learning (CLIP + face recognition) ─────────────────────────────
- name: Make sure the Immich ML container is running
  docker_container:
    name: "{{ immich_ml_container }}"
    image: "{{ immich_ml_image }}"
    pull: yes
    state: started
    networks:
      - name: "{{ immich_network }}"
    networks_cli_compatible: yes
    env:
      TRANSFORMERS_CACHE: "/cache"
    volumes:
      - "{{ docker_dir }}/{{ immich_ml_container }}:/cache"
    restart_policy: unless-stopped

# ── Immich Server (web UI + API) ───────────────────────────────────────────
- name: Make sure the Immich server container is running
  docker_container:
    name: "{{ container_name }}"
    image: "{{ immich_server_image }}"
    pull: yes
    state: started
    networks:
      - name: "{{ immich_network }}"
    networks_cli_compatible: yes
    published_ports:
      - "127.0.0.1:{{ immich_port }}:2283"
    env:
      TZ: "{{ timezone }}"
      DB_HOSTNAME: "{{ immich_db_container }}"
      DB_USERNAME: "{{ immich_db_user }}"
      DB_PASSWORD: "{{ immich_db_password }}"
      DB_DATABASE_NAME: "{{ immich_db_name }}"
      REDIS_HOSTNAME: "{{ immich_redis_container }}"
      IMMICH_MACHINE_LEARNING_URL: "http://{{ immich_ml_container }}:3003"
      UPLOAD_LOCATION: "/usr/src/app/upload"
    volumes:
      - "{{ immich_upload_dir }}:/usr/src/app/upload"
      - "/etc/localtime:/etc/localtime:ro"
    restart_policy: unless-stopped

- name: Wait for Immich API to be ready
  uri:
    url: "http://127.0.0.1:{{ immich_port }}/api/server/ping"
    status_code: 200
  register: immich_ping
  retries: 60
  delay: 3
  until: immich_ping.status == 200

- name: Check Immich initial setup state
  uri:
    url: "http://127.0.0.1:{{ immich_port }}/api/server/config"
    method: GET
    status_code: 200
  register: immich_config
  no_log: true

- name: Try to log in (admin already exists?)
  uri:
    url: "http://127.0.0.1:{{ immich_port }}/api/auth/login"
    method: POST
    body_format: json
    body:
      email: "{{ immich_admin_email }}"
      password: "{{ immich_admin_password }}"
    status_code: [200, 201, 401, 403, 404, 500]
  register: immich_login
  no_log: true

- name: Bootstrap Immich admin user (first run only)
  uri:
    url: "http://127.0.0.1:{{ immich_port }}/api/auth/admin-sign-up"
    method: POST
    body_format: json
    body:
      email: "{{ immich_admin_email }}"
      password: "{{ immich_admin_password }}"
      name: "{{ immich_admin_name | default('Batjaa') }}"
    status_code: [201, 400, 403]
  register: immich_signup
  no_log: true
  when: immich_login.status not in [200, 201]
