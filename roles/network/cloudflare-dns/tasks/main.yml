---
# Manage Cloudflare DNS records via API.
# Runs on the controller (delegate_to: localhost) — no SSH overhead, single API caller.

- name: Manage Cloudflare DNS zones
  include_tasks: zone.yml
  loop: >-
    {{
      [{'name': cloudflare_zone, 'records': cloudflare_records}]
      + cloudflare_additional_zones
    }}
  loop_control:
    loop_var: cloudflare_managed_zone
    label: "{{ cloudflare_managed_zone.name }}"
  run_once: true
