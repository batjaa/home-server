---
# Cloudflare zone (defaults to {{ host }})
cloudflare_zone: "{{ host }}"

# List of DNS records to manage. Example:
#   cloudflare_records:
#     - { name: plex, type: CNAME, content: '{{ host }}', proxied: false }
cloudflare_records: []

# Additional app-owned zones managed with the same token. Example:
#   cloudflare_additional_zones:
#     - name: example.app
#       records:
#         - { name: '@', type: CNAME, content: 'ddns.example.net', proxied: true }
cloudflare_additional_zones: []
