---
# Simplified SWAG role:
# - host networking (binds 80/443 directly)
# - wildcard cert for *.{{ host }} via Cloudflare DNS-01
# - proxy configs for each enabled service in proxy-confs/

- name: Ensure SWAG directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ username }}"
    # The SWAG image normalizes bind-mounted paths to PUID:PGID on startup.
    # Match that ownership here so a second Ansible run stays a no-op.
    group: "{{ guid }}"
    mode: '0775'
  loop:
    - "{{ docker_dir }}/swag"
    - "{{ docker_dir }}/swag/nginx"
    - "{{ docker_dir }}/swag/nginx/proxy-confs"
    - "{{ docker_dir }}/swag/dns-conf"
    - "{{ docker_dir }}/swag/letsencrypt"

- name: Install shared internal-only access snippet
  template:
    src: internal-only.conf.j2
    dest: "{{ docker_dir }}/swag/nginx/internal-only.conf"
    # SWAG normalizes files under /config/nginx to 0664 on startup.
    mode: '0664'
  notify: restart swag

- name: Install Cloudflare DNS-01 credentials
  template:
    src: dns-conf/cloudflare.ini.j2
    dest: "{{ docker_dir }}/swag/dns-conf/cloudflare.ini"
    mode: '0600'
  no_log: true

- name: Install proxy configs
  template:
    src: "{{ item }}"
    dest: "{{ docker_dir }}/swag/nginx/proxy-confs/{{ item | basename | regex_replace('.j2$', '') }}"
    mode: '0664'
  with_fileglob:
    - "templates/proxy-confs/*.j2"
  notify: restart swag

- name: Make sure the SWAG container is running
  docker_container:
    name: swag
    image: ghcr.io/linuxserver/swag:latest
    pull: yes
    state: started
    network_mode: host
    capabilities:
      - NET_ADMIN
    env:
      PUID: "{{ guid }}"
      PGID: "{{ guid }}"
      TZ: "{{ timezone }}"
      URL: "{{ host }}"
      SUBDOMAINS: "wildcard"
      EXTRA_DOMAINS: "{{ swag_extra_domains }}"
      VALIDATION: "dns"
      DNSPLUGIN: "cloudflare"
      EMAIL: "{{ email }}"
      STAGING: "{{ swag_staging | default('false') }}"
    volumes:
      - "{{ docker_dir }}/swag/nginx:/config/nginx"
      - "{{ docker_dir }}/swag/dns-conf:/config/dns-conf"
      - "{{ docker_dir }}/swag/letsencrypt:/config/etc/letsencrypt"
    restart_policy: unless-stopped

# SWAG's env-change detection lives in /config/.donoteditthisfile.conf, which
# is NOT on a persisted volume here (only nginx/, dns-conf/, letsencrypt/ are)
# — so every container recreate seeds fresh state from the current env and
# concludes "parameters unchanged", and a domain added to EXTRA_DOMAINS never
# triggers reissuance. Compare the live cert's SANs against the requested
# domain set instead and run certbot only when they diverge: idempotent, and
# the old cert stays in place if issuance fails (no revoke-first window).

- name: Read certificate SANs
  command: >
    docker exec swag openssl x509
    -in /config/etc/letsencrypt/live/{{ host }}/fullchain.pem
    -noout -ext subjectAltName
  register: swag_cert_sans
  changed_when: false

- name: Determine requested domains missing from the certificate
  set_fact:
    swag_missing_domains: >-
      {{
        (swag_extra_domains.split(',') | map('trim') | select() | list)
        | difference(swag_cert_sans.stdout | regex_findall('DNS:([^,\s]+)'))
      }}

- name: Re-issue certificate to cover added domains
  command: >
    docker exec swag certbot certonly --non-interactive --agree-tos
    --config-dir /config/etc/letsencrypt
    --work-dir /tmp/letsencrypt
    --logs-dir /config/log/letsencrypt
    --expand --force-renewal --cert-name {{ host }}
    --dns-cloudflare
    --dns-cloudflare-credentials /config/dns-conf/cloudflare.ini
    --dns-cloudflare-propagation-seconds 30
    --key-type ecdsa
    --email {{ email }}
    -d "{{ host }}" -d "*.{{ host }}"
    {% for d in swag_extra_domains.split(',') | map('trim') | select() %}-d "{{ d }}" {% endfor %}
  when: swag_missing_domains | length > 0
  register: swag_cert_reissue
  notify: restart swag
