---
- name: Ensure textfile_collector dir exists
  file:
    path: "{{ arr_monitor_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install arr-textfile script
  copy:
    src: arr-textfile.py
    dest: /usr/local/sbin/arr-textfile
    owner: root
    group: root
    mode: '0755'

- name: Render env file with vault-sourced API keys
  template:
    src: arr-textfile.env.j2
    dest: /etc/arr-textfile.env
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Install arr-textfile.service
  template:
    src: arr-textfile.service.j2
    dest: /etc/systemd/system/arr-textfile.service
    owner: root
    group: root
    mode: '0644'
  register: arr_service

- name: Install arr-textfile.timer
  template:
    src: arr-textfile.timer.j2
    dest: /etc/systemd/system/arr-textfile.timer
    owner: root
    group: root
    mode: '0644'
  register: arr_timer

- name: Reload systemd if arr units changed
  systemd:
    daemon_reload: yes
  when: arr_service.changed or arr_timer.changed

- name: Enable and start arr-textfile.timer
  systemd:
    name: arr-textfile.timer
    enabled: yes
    state: started

- name: Seed arr metrics once
  command: /usr/local/sbin/arr-textfile
  environment:
    ARR_APPS: "{{ arr_apps | to_json }}"
  changed_when: false
