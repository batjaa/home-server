---
# Phase 3d — health & observability.
# - smartd: daily short test 03:00, weekly long test Sunday 04:00, email on alert
# - btrfs scrub timers: monthly on each btrfs mountpoint
# - storage-failures.log: aggregate OnFailure= log target

- name: "[health] Install smartmontools + jq (used by textfile collector)"
  package:
    name:
      - smartmontools
      - jq
    state: present

- name: "[health] Configure smartd.conf"
  template:
    src: smartd.conf.j2
    dest: /etc/smartd.conf
    mode: '0644'
    backup: yes
  register: smartd_conf

- name: "[health] Enable + restart smartd"
  systemd:
    name: smartd
    enabled: yes
    state: "{{ 'restarted' if smartd_conf.changed else 'started' }}"

# ── btrfs scrub timers (one per btrfs mountpoint) ──────────────────────────
- name: "[health] Build btrfs mountpoint list"
  set_fact:
    btrfs_mountpoints: >-
      {{ [primary.mount]
         + (storage_drives
            | selectattr('role', 'equalto', 'backup')
            | map(attribute='mount')
            | list) }}
  vars:
    primary: "{{ storage_drives | selectattr('name', 'equalto', 'primary') | first }}"

- name: "[health] Install btrfs-scrub@.service template"
  template:
    src: btrfs-scrub.service.j2
    dest: /etc/systemd/system/btrfs-scrub@.service
    mode: '0644'
  register: scrub_service

- name: "[health] Install btrfs-scrub@.timer template"
  template:
    src: btrfs-scrub.timer.j2
    dest: /etc/systemd/system/btrfs-scrub@.timer
    mode: '0644'
  register: scrub_timer

- name: "[health] Reload systemd if scrub units changed"
  systemd:
    daemon_reload: yes
  when: scrub_service.changed or scrub_timer.changed

- name: "[health] Enable + start scrub timers per mountpoint"
  systemd:
    name: "btrfs-scrub@{{ item | regex_replace('^/mnt/', '') }}.timer"
    enabled: yes
    state: started
  loop: "{{ btrfs_mountpoints }}"

# ── Centralised failure log via systemd OnFailure= helper ──────────────────
- name: "[health] Install storage-failure-log helper"
  copy:
    dest: /usr/local/sbin/storage-failure-log
    mode: '0755'
    content: |
      #!/bin/sh
      # Called by systemd OnFailure= for storage units.
      # Writes a one-liner per failure; tail -f /var/log/storage-failures.log
      printf '%s %s failed (exit=%s)\n' "$(date '+%F %T')" "${1:-unknown}" "${2:-?}" >> /var/log/storage-failures.log

- name: "[health] Touch failures log"
  file:
    path: /var/log/storage-failures.log
    state: touch
    owner: root
    group: root
    mode: '0644'
    modification_time: preserve
    access_time: preserve

- name: "[health] Logrotate for storage-failures.log"
  copy:
    dest: /etc/logrotate.d/storage-failures
    mode: '0644'
    content: |
      /var/log/storage-failures.log {
          weekly
          rotate 8
          compress
          missingok
          notifempty
          create 0644 root root
      }

# ── Prometheus textfile collector for storage health ──────────────────────
- name: "[health] Ensure textfile_collector dir for node_exporter"
  file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: '0755'

- name: "[health] Install storage-textfile script"
  copy:
    src: storage-textfile.sh
    dest: /usr/local/sbin/storage-textfile
    owner: root
    group: root
    mode: '0755'

- name: "[health] Install storage-textfile.service"
  template:
    src: storage-textfile.service.j2
    dest: /etc/systemd/system/storage-textfile.service
    mode: '0644'
  register: tf_service

- name: "[health] Install storage-textfile.timer"
  template:
    src: storage-textfile.timer.j2
    dest: /etc/systemd/system/storage-textfile.timer
    mode: '0644'
  register: tf_timer

- name: "[health] Reload systemd if textfile units changed"
  systemd:
    daemon_reload: yes
  when: tf_service.changed or tf_timer.changed

- name: "[health] Enable and start storage-textfile.timer"
  systemd:
    name: storage-textfile.timer
    enabled: yes
    state: started

- name: "[health] Run textfile collector once to seed metrics"
  systemd:
    name: storage-textfile.service
    state: started
  changed_when: false

# ── Intel GPU metrics (only on hosts with /dev/dri) ────────────────────────
- name: "[health] Detect Intel iGPU"
  stat:
    path: /dev/dri/renderD128
  register: igpu

- name: "[health] Install intel-gpu-tools (provides intel_gpu_top)"
  package:
    name: intel-gpu-tools
    state: present
  when: igpu.stat.exists

- name: "[health] Install intel-gpu-textfile script"
  copy:
    src: intel-gpu-textfile.sh
    dest: /usr/local/sbin/intel-gpu-textfile
    owner: root
    group: root
    mode: '0755'
  when: igpu.stat.exists

- name: "[health] Install intel-gpu-textfile.service"
  template:
    src: intel-gpu-textfile.service.j2
    dest: /etc/systemd/system/intel-gpu-textfile.service
    mode: '0644'
  when: igpu.stat.exists
  register: igpu_service

- name: "[health] Install intel-gpu-textfile.timer"
  template:
    src: intel-gpu-textfile.timer.j2
    dest: /etc/systemd/system/intel-gpu-textfile.timer
    mode: '0644'
  when: igpu.stat.exists
  register: igpu_timer

- name: "[health] Reload systemd if intel-gpu units changed"
  systemd:
    daemon_reload: yes
  when: igpu.stat.exists and (igpu_service.changed or igpu_timer.changed)

- name: "[health] Enable intel-gpu-textfile.timer"
  systemd:
    name: intel-gpu-textfile.timer
    enabled: yes
    state: started
  when: igpu.stat.exists

- name: "[health] Seed intel-gpu metrics once"
  systemd:
    name: intel-gpu-textfile.service
    state: started
  changed_when: false
  when: igpu.stat.exists

- name: "[health] Show scrub + textfile timers"
  command: "systemctl list-timers 'btrfs-scrub@*' 'storage-textfile.timer' --no-pager"
  changed_when: false
  register: timers_list

- name: "[health] Display schedule"
  debug:
    msg: "{{ timers_list.stdout_lines }}"
