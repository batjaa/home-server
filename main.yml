---
#
# Pi infrastructure node (tentomon)
#
- hosts: pi
  become: yes

  roles:
      - role: system
        tags:
            - system

      - role: geerlingguy.security
        tags:
            - security

      - role: docker
        tags:
            - docker
        when: enable_docker | default(false)

      - role: geerlingguy.ntp
        tags:
            - ntp

      - role: network/cloudflare-ddns
        tags:
            - cloudflare-ddns
            - containers
        when: enable_cloudflare_ddns | default(false)

      - role: network/cloudflare-dns
        tags:
            - cloudflare-dns
        when: cloudflare_records | default([]) | length > 0

      - role: network/pihole
        tags:
            - pihole
            - containers
        when: enable_pihole | default(false)

      - role: geerlingguy.node_exporter
        tags:
            - node_exporter
            - monitoring
        when: enable_node_exporter | default(false)

      - role: containers/monitoring/uptime-kuma
        tags:
            - uptime-kuma
            - monitoring
            - containers
        when: enable_uptime_kuma | default(false) | bool

